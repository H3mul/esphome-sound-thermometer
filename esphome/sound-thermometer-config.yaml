<<: !include ../../base-esphome-configuration.yaml

esphome:
  name: sound-thermometer
  friendly_name: Sound Thermometer
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: sound_level_led

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

wifi:
  # networks:
  # - ssid: !secret wifi_ssid
  #   password: !secret wifi_password
  # fast_connect: true
  # use_address: !secret sound_thermometer_local_ip
  # Fallback AP mode when WiFi is unavailable
  ap:
    password: !secret ap_password

external_components:
  - source: github://H3mul/esphome-components
    components: [fakelight]
    
ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server
  

web_server:
  port: 80
  local: true
  version: 3
  auth:
    username: !secret web_server_username
    password: !secret web_server_password
  sorting_groups:
    - id: led_settings
      name: "LED Display Settings"
      sorting_weight: 0
    - id: mic_readings
      name: "Microphone"
      sorting_weight: 1
    - id: mic_settings
      name: "Microphone Settings"
      sorting_weight: 2
    - id: power_options
      name: "Power Safety"
      sorting_weight: 3

globals:
  - id: mic_signal_amplitude
    type: float
    restore_value: no
    # 3.3V Peak-to-Peak / 2 = 1.65V RMS reference
    initial_value: "1650.0" #mV

interval:
  - interval: 10s
    startup_delay: 0.5s
    then:
      - script.execute: check_power_safety

script:
  - id: check_power_safety
    then:
      - if:
          condition:
            lambda: 'return id(power_mosfet).state && id(usb_source_rating).state < id(usb_current_requirement).state;'
          then:
            - logger.log:
                format: "SAFETY CUTOFF: USB Source too weak to support current requirement (%.1fA < %.1fA). Main power disabled."
                args: [ 'id(usb_source_rating).state', 'id(usb_current_requirement).state' ]
                level: WARN
            - switch.turn_off: power_mosfet
      - if:
          condition:
            lambda: 'return !id(power_mosfet).state && id(usb_source_rating).state >= id(usb_current_requirement).state;'
          then:
            - logger.log: "Power OK. LEDs Active."
            - switch.turn_on: power_mosfet

switch:
  - platform: gpio
    pin: GPIO10
    name: "Main Power Switch"
    id: power_mosfet
    internal: true
    # Default to OFF to prevent brownout on boot
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: template
    name: "Power Safety Cutoff Active"
    icon: "mdi:flash-triangle"
    id: power_safety_state
    lambda: |-
      if (id(power_mosfet).state) {
        return false; // Power OK
      } else {
        return true;  // Power Cutoff Active
      }
    web_server:
      sorting_group_id: power_options

number:
  - platform: template
    name: "Sound Monitor Peak Decay Rate"
    id: peak_decay_rate
    min_value: 0.0
    max_value: 100.0
    step: 1.0
    initial_value: 50.0
    optimistic: true
    unit_of_measurement: " %/s"
    web_server:
      sorting_group_id: led_settings
    icon: "mdi:timer-sand"
    restore_value: true

  - platform: template
    name: "USB Current Requirement"
    id: usb_current_requirement
    icon: "mdi:flash"
    step: 0.1
    min_value: 0.1
    max_value: 5.0
    unit_of_measurement: "A"
    initial_value: 1.5
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: power_options
    on_value:
      - script.execute: check_power_safety

  - platform: template
    name: "Mic Compression Ratio"
    id: mic_compression_ratio
    icon: "mdi:knob"
    step: 0.1
    min_value: 0.01
    max_value: 2.0
    # step: 10.0
    initial_value: 1.0
    optimistic: true
    unit_of_measurement: "ratio"
    restore_value: true
    web_server:
      sorting_group_id: mic_settings

  - platform: template
    name: "Mic Sensitivity Floor"
    id: mic_floor
    icon: "mdi:knob"
    step: 1
    min_value: -60.0
    max_value: 0.0
    initial_value: -25.0
    unit_of_measurement: "dB"
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: mic_settings

  - platform: template
    name: "Mic Sensitivity Ceiling"
    id: mic_ceiling
    icon: "mdi:knob"
    step: 1
    min_value: -60.0
    max_value: 0.0
    initial_value: 0.0
    unit_of_measurement: "dB"
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: mic_settings

sensor:
  - platform: adc
    pin: GPIO4
    name: "USB-C CC1 Voltage"
    id: cc1_voltage
    icon: "mdi:lightning-bolt-circle"
    web_server:
      sorting_group_id: power_options
    attenuation: 12db # Allows reading up to ~3.1V
    update_interval: 5s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  - platform: adc
    pin: GPIO3
    name: "USB-C CC2 Voltage"
    id: cc2_voltage
    icon: "mdi:lightning-bolt-circle"
    web_server:
      sorting_group_id: power_options
    attenuation: 12db
    update_interval: 5s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  - platform: adc
    pin: GPIO1
    name: "USB-A D+ Voltage"
    id: d_plus_voltage
    icon: "mdi:lightning-bolt-circle"
    web_server:
      sorting_group_id: power_options
    attenuation: 12db
    update_interval: 2s

  - platform: template
    name: "USB Source Current Capability"
    id: usb_source_rating
    icon: "mdi:lightning-bolt-circle"
    unit_of_measurement: "A"
    accuracy_decimals: 1
    web_server:
      sorting_group_id: power_options
    update_interval: 2s
    on_value:
      - script.execute: check_power_safety
    lambda: |-
      float cc_max = max(id(cc1_voltage).state, id(cc2_voltage).state);
      float dp = id(d_plus_voltage).state;

      // 1. Priority: Native USB-C (C-to-C Cable) - High CC voltage
      if (cc_max > 1.23) return 3.0; // 3.0A C-to-C
      if (cc_max > 0.66) return 1.5; // 1.5A C-to-C

      // 2. Attempt to assume current limitations for legacy USB-A chargers
      //    based on D+ voltage levels
      if (dp > 2.8) {
        // Case A: 3A Brick
        // D+ is high AND CC is near 0V -> Assumes 3.0A
        if (cc_max < 0.1) {
          return 3.0;
        }

        // Case B: 2.1A Brick (DCP + Legacy Cable)
        // D+ is high AND CC is at Default USB level (0.25V - 0.5V) -> Assign 2.1A
        if (cc_max > 0.25 && cc_max < 0.5) {
          return 2.1;
        }

        // Fallback for any other high D+ reading
        return 2.5;
      }

      // 3. Mid-Power Legacy Charger (D+ is high: 1.0V - 2.8V)
      // Catches Apple 2.7V, Samsung 1.2V etc., that didn't hit the 2.8V threshold
      if (dp > 1.0) {
        return 2.1;
      }

      // 4. Low Power (Computer Port / Default)
      // D+ will be pulled down to < 0.6V by a PC's internal resistor.
      return 0.5;

  - platform: adc
    name: Raw Microphone Input Voltage
    id: mic_raw_level
    pin: GPIO0
    update_interval: 0ms
    attenuation: 12db
    internal: true
    unit_of_measurement: "mV"
    web_server:
      sorting_group_id: mic_readings
    icon: "mdi:waveform"
    filters:
      - multiply: 1000  # mV

  # - platform: template
  #   id: mic_noise_floor
  #   name: "Mic Noise Floor"
  #   lambda: return id(mic_raw_level).state;
  #   update_interval: 0ms
  #   unit_of_measurement: "mV"
  #   web_server:
  #     sorting_group_id: mic_readings
  #   icon: "mdi:chart-line"
  #   filters:
  #     - sliding_window_moving_average:
  #         window_size: 1000
  #         send_every: 10
  #     - throttle: 100ms

  - platform: template
    id: mic_processed_level
    name: "Mic Raw Level"
    lambda: return id(mic_raw_level).state;
    unit_of_measurement: "dB"
    update_interval: 0ms
    web_server:
      sorting_group_id: mic_readings
    icon: "mdi:chart-line"
    filters:
      - offset: !lambda return (-1.0) * id(mic_signal_amplitude);
      - lambda: return fabs(x);
      - sliding_window_moving_average:
          window_size: 20
          send_every: 3
      - lambda: return 20.0 * log10(x / id(mic_signal_amplitude));
      - throttle: 20ms

  - platform: template
    id: mic_percentage_level
    name: "Mic Level Percentage"
    unit_of_measurement: "%"
    update_interval: 0ms
    web_server:
      sorting_group_id: mic_readings
    icon: "mdi:chart-line"
    lambda: return id(mic_processed_level).state;
    filters:
      - offset: !lambda return (-1.0) * id(mic_floor).state;
      - multiply: !lambda return id(mic_compression_ratio).state;
      - lambda: |-
          // Remap loudness level linearly between signal floor dB and 0 dB to 0% - 100%
          return x / (id(mic_ceiling).state - id(mic_floor).state) * 100.0;
      - clamp:
          min_value: 0.0
          max_value: 100.0
      - lambda: |-
          static uint32_t last_peak_update = 0;
          static float sound_peak = 0.0f;

          uint32_t now = millis();
          if (last_peak_update == 0) last_peak_update = now;
          float dt = (now - last_peak_update) / 1000.0f;
          last_peak_update = now;

          float decay = id(peak_decay_rate).state;
          sound_peak = (decay > 0.0 && x < sound_peak) ? sound_peak - decay * dt : x;

          if (sound_peak < 0.0f) sound_peak = 0.0f;
          if (sound_peak > 100.0f) sound_peak = 100.0f;
          return sound_peak;
      - throttle: 20ms

light:
  - platform: fakelight
    name: "Sound Monitor Max Color"
    id: max_sound_color
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: led_settings
    icon: "mdi:lightbulb"

  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    pin: GPIO6
    num_leds: 60  # Adjust number of LEDs as needed
    id: sound_level_led
    name: "Sound Monitor"
    web_server:
      sorting_group_id: led_settings
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:lightbulb"
    on_turn_on:
      - light.control:
          id: sound_level_led
          effect: "Sound Gradient"
    effects:
      - addressable_lambda:
          name: "Sound Gradient"
          update_interval: 50ms
          lambda: |-
            auto mic_level = id(mic_percentage_level).state;

            // level is already smoothed by sensor filter, just use it directly
            int num_lit = (int)(mic_level / 100.0f * it.size());

            auto highColor = id(max_sound_color).current_values;
            Color endColor = Color(
                  (uint8_t)(highColor.get_red() * 255),
                  (uint8_t)(highColor.get_green() * 255),
                  (uint8_t)(highColor.get_blue() * 255)
              );

            // Light up LEDs proportionally
            for (int i = 0; i < it.size(); i++) {
              if (i < num_lit && num_lit > 0) {
                it[i] = current_color.gradient(endColor, (float)(i) / it.size() * 255);
              } else {
                // Unlit LEDs: off (black)
                it[i] = Color::BLACK;
              }
            }
