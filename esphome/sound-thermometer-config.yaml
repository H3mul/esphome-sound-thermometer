<<: !include ../../base-esphome-configuration.yaml

esphome:
  name: sound-thermometer
  friendly_name: Sound Thermometer
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: sound_level_led

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG
  logs:
    sensor: INFO

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  fast_connect: true
  use_address: !secret sound_thermometer_local_ip

external_components:
  - source: github://H3mul/esphome-components
    components: [fakelight]


web_server:
    port: 80
    local: true
    version: 3
    sorting_groups:
      - id: led_settings
        name: "LED Display Settings"
        sorting_weight: 0
      - id: mic_settings
        name: "Microphone"
        sorting_weight: 1
      - id: sound_settings
        name: "Sound Processing Settings"
        sorting_weight: 2

number:
  - platform: template
    name: "Smoothing Attack Rate"
    id: attack_rate
    min_value: 0.01
    max_value: 1.0
    step: 0.01
    initial_value: 0.3
    optimistic: true
    web_server:
      sorting_group_id: sound_settings
    restore_value: true

  - platform: template
    name: "Smoothing Decay Rate"
    id: decay_rate
    min_value: 0.01
    max_value: 1.0
    step: 0.01
    initial_value: 0.05
    optimistic: true
    web_server:
      sorting_group_id: sound_settings
    restore_value: true

  - platform: template
    name: "Mic Level Test"
    id: test_level
    min_value: 0.01
    max_value: 3.3
    step: 0.01
    initial_value: 0.05
    optimistic: true
    web_server:
      sorting_group_id: mic_settings
    restore_value: true

  - platform: template
    name: "Sound Level Idle"
    id: level_idle
    min_value: 0.01
    max_value: 5.0
    step: 0.01
    initial_value: 2.5
    unit_of_measurement: "V"
    optimistic: true
    web_server:
      sorting_group_id: sound_settings
    restore_value: true

  - platform: template
    name: "Sound Level Sensitivity"
    id: level_sensitivity
    min_value: 0.01
    max_value: 5.0
    step: 0.01
    initial_value: 2.5
    unit_of_measurement: "V"
    optimistic: true
    web_server:
      sorting_group_id: sound_settings
    restore_value: true

light:
  - platform: fakelight
    name: "Max Sound Color"
    id: max_sound_color
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: led_settings

  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    pin: GPIO1
    num_leds: 10  # Adjust number of LEDs as needed
    id: sound_level_led
    name: "LED"
    web_server:
      sorting_group_id: led_settings
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - light.control: 
          id: sound_level_led
          effect: "Sound Gradient"
    effects:
      - addressable_lambda:
          name: "Sound Gradient"
          update_interval: 100ms
          lambda: |-
            auto mic_level = id(mic_adc_level).state;

            // level is already smoothed by sensor filter, just use it directly
            int num_lit = (int)(mic_level / 100.0f * it.size());

            auto highColor = id(max_sound_color).current_values;
            Color endColor = Color(
                  (uint8_t)(highColor.get_red() * 255),
                  (uint8_t)(highColor.get_green() * 255),
                  (uint8_t)(highColor.get_blue() * 255)
              );
            
            // Light up LEDs proportionally
            for (int i = 0; i < it.size(); i++) {
              if (i < num_lit && num_lit > 0) {
                it[i] = current_color.gradient(endColor, (float)(i) / it.size() * 255);
              } else {
                // Unlit LEDs: off (black)
                it[i] = Color::BLACK;
              }
            }
