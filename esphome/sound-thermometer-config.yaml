<<: !include ../../base-esphome-configuration.yaml

esphome:
  name: sound-thermometer
  friendly_name: Sound Thermometer
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: sound_level_led

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG
  logs:
    sensor: INFO

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  fast_connect: true
  use_address: !secret sound_thermometer_local_ip

external_components:
  - source: github://H3mul/esphome-components
    components: [fakelight]


web_server:
    port: 80
    local: true
    version: 3
    sorting_groups:
      - id: led_settings
        name: "LED Display Settings"
        sorting_weight: 0
      - id: mic_readings
        name: "Microphone"
        sorting_weight: 1
      - id: mic_settings
        name: "Microphone Settings"
        sorting_weight: 2

number:

  - platform: template
    name: "Peak Decay Rate"
    id: peak_decay_rate
    min_value: 0.0
    max_value: 100.0
    step: 1.0
    initial_value: 50.0
    optimistic: true
    unit_of_measurement: " %/s"
    web_server:
      sorting_group_id: mic_settings
    icon: "mdi:timer-sand"
    restore_value: true

  - platform: template
    name: "Mic Sensitivity Level"
    id: mic_sensitivity_level
    icon: "mdi:tune"
    step: 1
    min_value: 0.0
    max_value: 1700.0
    # step: 10.0
    initial_value: 100.0 # Default gain. 100.0 means 1.0 from mic = 100%
    optimistic: true     # Allows changing the value from the UI
    unit_of_measurement: "mV"
    restore_value: true
    web_server:
      sorting_group_id: mic_settings

  - platform: template
    name: "Mic Zero dB Level "
    id: zero_db_level
    icon: "mdi:tune"
    step: 1
    min_value: -100.0
    max_value: 0.0
    # step: 10.0
    initial_value: -40.0
    unit_of_measurement: "dB"
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: mic_settings

sensor:
  - platform: adc
    name: Raw Microphone Input Voltage
    id: mic_raw_level
    pin: GPIO0
    update_interval: 0ms
    attenuation: 12db
    internal: true
    unit_of_measurement: "mV"
    web_server:
      sorting_group_id: mic_readings
    icon: "mdi:waveform"
    filters:
      - multiply: 1000  # mV

  - platform: template
    id: mic_noise_floor
    name: "Mic Noise Floor"
    lambda: return id(mic_raw_level).state;
    update_interval: 0ms
    unit_of_measurement: "mV"
    web_server:
      sorting_group_id: mic_readings
    icon: "mdi:chart-line"
    filters:
      - sliding_window_moving_average:
          window_size: 1000
          send_every: 10
      - throttle: 100ms

  - platform: template
    id: mic_processed_level
    name: "Mic Level Processed"
    lambda: return id(mic_raw_level).state;
    unit_of_measurement: "dB"
    update_interval: 0ms
    web_server:
      sorting_group_id: mic_readings
    icon: "mdi:chart-line"
    filters:
      - offset: !lambda return (-1.0) * id(mic_noise_floor).state;
      - lambda: return fabs(x);
      - sliding_window_moving_average:
          window_size: 20
          send_every: 3 
      - lambda: return 20.0 * log10(x / id(mic_sensitivity_level).state);
      - throttle: 20ms

  - platform: template
    id: mic_percentage_level
    name: "Mic Level Percentage"
    lambda: return id(mic_processed_level).state;
    unit_of_measurement: "%"
    update_interval: 0ms
    web_server:
      sorting_group_id: mic_readings
    icon: "mdi:chart-line"
    filters:
      - lambda: return (x - id(zero_db_level).state) / (-1.0 * id(zero_db_level).state) * 100.0;
      - clamp:
          min_value: 0.0
          max_value: 100.0
      - lambda: |-
          static uint32_t last_peak_update = 0;
          static float sound_peak = 0.0f;

          uint32_t now = millis();
          if (last_peak_update == 0) last_peak_update = now;
          float dt = (now - last_peak_update) / 1000.0f;
          last_peak_update = now;

          float decay = id(peak_decay_rate).state;
          sound_peak = (decay > 0.0 && x < sound_peak) ? sound_peak - decay * dt : x;

          if (sound_peak < 0.0f) sound_peak = 0.0f;
          if (sound_peak > 100.0f) sound_peak = 100.0f;
          return sound_peak;
      - throttle: 20ms


light:
  - platform: fakelight
    name: "Sound Monitor Max Color"
    id: max_sound_color
    restore_mode: RESTORE_DEFAULT_ON
    web_server:
      sorting_group_id: led_settings
    icon: "mdi:lightbulb"

  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    pin: GPIO1
    num_leds: 10  # Adjust number of LEDs as needed
    id: sound_level_led
    name: "Sound Monitor"
    web_server:
      sorting_group_id: led_settings
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:lightbulb"
    on_turn_on:
      - light.control: 
          id: sound_level_led
          effect: "Sound Gradient"
    effects:
      - addressable_lambda:
          name: "Sound Gradient"
          update_interval: 50ms
          lambda: |-
            auto mic_level = id(mic_percentage_level).state;

            // level is already smoothed by sensor filter, just use it directly
            int num_lit = (int)(mic_level / 100.0f * it.size());

            auto highColor = id(max_sound_color).current_values;
            Color endColor = Color(
                  (uint8_t)(highColor.get_red() * 255),
                  (uint8_t)(highColor.get_green() * 255),
                  (uint8_t)(highColor.get_blue() * 255)
              );
            
            // Light up LEDs proportionally
            for (int i = 0; i < it.size(); i++) {
              if (i < num_lit && num_lit > 0) {
                it[i] = current_color.gradient(endColor, (float)(i) / it.size() * 255);
              } else {
                // Unlit LEDs: off (black)
                it[i] = Color::BLACK;
              }
            }
